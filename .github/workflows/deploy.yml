name: CI/CD - Build, Push & Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/render-project

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          HOOK="$(echo "$HOOK" | tr -d '[:space:]')"   # strip stray spaces/newlines from copy-paste
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Tell Render to deploy exactly the image we just pushed (tagged with the commit SHA)
          curl --fail -G -X POST "$HOOK" \
            --data-urlencode "imgURL=docker.io/${{ env.IMAGE }}:${{ github.sha }}"
