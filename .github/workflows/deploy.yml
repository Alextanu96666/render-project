name: CI/CD - Test, Build, Push & Deploy to Render

# GitHub upptäcker en push till main eller dev, en pull request eller en manuell start.
#   main -> production
#   dev  -> development
on:
  push:
    branches: [main, dev]
  pull_request:          # pull requests kör bara testerna, de driftsätter aldrig
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/render-project

jobs:
  test:
    # En runner startas.
    runs-on: ubuntu-latest
    steps:
      # Projektets kod hämtas.
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.js installeras.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Projektets beroenden installeras.
      - name: Install dependencies
        run: npm ci

      # Testerna körs.
      - name: Run tests
        run: npm test

      # Appen byggs för att kontrollera att den fungerar.
      - name: Check that the app builds
        run: npm run build

  # Om testerna går igenom och det inte är en pull request:
  build-and-push:
    needs: test                                  # inga gröna tester -> ingen image
    if: github.event_name != 'pull_request'      # driftsätt inte från pull requests
    # En ny runner startas (varje jobb körs på en egen runner).
    runs-on: ubuntu-latest
    steps:
      # Koden hämtas igen.
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker Buildx förbereds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Workflowen loggar in på Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # En Docker-image byggs och pushas. Samma image används i alla miljöer,
      # texten per miljö kommer från WELCOME_MESSAGE på Render.
      # Taggar: commit-SHA, branchnamnet (main/dev) och latest (bara från main).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ github.ref_name == 'main' && format('{0}:latest', env.IMAGE) || '' }}

  deploy:
    needs: build-and-push
    # En tredje runner startas.
    runs-on: ubuntu-latest
    # Väljer GitHub-miljö efter branch. Varje miljö har sin egen RENDER_DEPLOY_HOOK_URL.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      # Render får en signal via deploy-hooken att driftsätta den nya imagen.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          HOOK="$(echo "$HOOK" | tr -d '[:space:]')"   # ta bort mellanslag/radbrytningar från copy-paste
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing. Add it in Settings > Environments."
            exit 1
          fi
          # Be Render driftsätta exakt den image vi just pushade (taggad med commit-SHA)
          curl --fail -G -X POST "$HOOK" \
            --data-urlencode "imgURL=docker.io/${{ env.IMAGE }}:${{ github.sha }}"

# Resultatet rapporteras i GitHub (under fliken Actions och på commiten/PR:en).
